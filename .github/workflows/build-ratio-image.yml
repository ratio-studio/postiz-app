name: Build Ratio Image

on:
  push:
    branches:
      - codex/ratio-branding-youtube-scopes
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/postiz-app
  TAG: ratio

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push architecture image
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} \
            -f Dockerfile.dev \
            -t "${IMAGE}:${TAG}-${{ matrix.arch }}" \
            --build-arg NEXT_PUBLIC_VERSION=ratio \
            --pull --no-cache --provenance=false --sbom=false \
            --push .

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish multi-architecture manifest
        run: |
          docker manifest create "${IMAGE}:${TAG}" \
            --amend "${IMAGE}:${TAG}-amd64" \
            --amend "${IMAGE}:${TAG}-arm64"
          docker manifest push "${IMAGE}:${TAG}"
      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/postiz-app/visibility" \
            -f visibility=public
